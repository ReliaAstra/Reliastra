; Reliastra all-in-one supervision: frontend + backend + redis + celery + mcp.
; Priorities order startup: redis -> celery -> api -> mcp -> web.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
logfile_backups=0
loglevel=info

[program:redis]
command=redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --bind 127.0.0.1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=1
priority=10

[program:celery-worker]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info --concurrency=2 --without-heartbeat --without-gossip
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=%(ENV_ENABLE_CELERY)s
autorestart=true
startsecs=5
startretries=10
priority=20
stopwaitsecs=60

[program:celery-beat]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app beat --loglevel=info
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=%(ENV_ENABLE_CELERY)s
autorestart=true
startsecs=3
startretries=10
priority=21

[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers %(ENV_API_WORKERS)s
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=30

; MCP server: the agent-native interface to this API. Optional and OFF by
; default (ENABLE_MCP, exported in deploy/entrypoint.sh). It is a pure HTTP
; client of the api program on 127.0.0.1:8000 - no database, no Celery, no
; business logic of its own - so it starts after api and needs nothing else.
;
; It binds loopback only. The public path is api.$DOMAIN/mcp, terminated by
; Caddy (deploy/production/Caddyfile), which is why MCP_HTTP_ALLOWED_HOSTS must
; name that hostname: the proxy forwards the public Host, and the MCP SDK
; answers 421 Misdirected Request for any Host not on its allow-list. In
; production, ENVIRONMENT=production makes a missing value a startup refusal
; rather than a silent outage.
;
; Cost on this box: measured 72.9 MB RSS idle and 74.6 MB after 40 tool calls
; (single process, one thread, no growth between the two - it does not
; accumulate per-caller state). The api service is capped at 768M in
; deploy/production/compose.yml and that cgroup also holds the API, the web
; server, Celery and an internal Redis, so check the headroom before setting
; ENABLE_MCP=true. See docs/mcp/README.md.
[program:mcp]
command=/opt/venv/bin/python -m mcp_server --transport streamable-http
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=%(ENV_ENABLE_MCP)s
autorestart=true
startsecs=3
startretries=3
priority=35
; A tool call may run up to MCP_TOOL_TIMEOUT_S (30) plus its shutdown, so give
; it room to finish in-flight work instead of being killed mid-write.
stopwaitsecs=35

[program:web]
command=/usr/bin/node /app/web/server.js
directory=/app/web
user=reliastra
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=40
