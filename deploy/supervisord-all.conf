; Reliastra all-in-one supervision: frontend + backend + redis + celery.
; Priorities order startup: redis -> celery -> api -> web.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
logfile_backups=0
loglevel=info

[program:redis]
command=redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --bind 127.0.0.1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=1
priority=10

[program:celery-worker]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info --concurrency=2 --without-heartbeat --without-gossip
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=%(ENV_ENABLE_CELERY)s
autorestart=true
startsecs=5
startretries=10
priority=20
stopwaitsecs=60

[program:celery-beat]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app beat --loglevel=info
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=%(ENV_ENABLE_CELERY)s
autorestart=true
startsecs=3
startretries=10
priority=21

[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers %(ENV_API_WORKERS)s
directory=/app
user=reliastra
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=30

[program:web]
command=/usr/bin/node /app/web/server.js
directory=/app/web
user=reliastra
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=40
