# Production runtime — single VPS, extensible to multi-host
# Usage: IMAGE_DIGEST=sha256:... docker compose --env-file /opt/reliastra/.env.production -f compose.yml up -d
# Never `build:` for app services — pull immutable artifact from GHCR.

name: reliastra

services:
  # ── Reverse proxy — only public entrypoint
  proxy:
    image: caddy:2.9-alpine
    container_name: reliastra-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${IMAGE_REF:-ghcr.io/reliastra/reliastra@${IMAGE_DIGEST:?set IMAGE_DIGEST}}
    container_name: reliastra-api
    restart: unless-stopped
    env_file:
      - /opt/reliastra/.env.production
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  worker:
    image: ${IMAGE_REF:-ghcr.io/reliastra/reliastra@${IMAGE_DIGEST:?set IMAGE_DIGEST}}
    container_name: reliastra-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    env_file:
      - /opt/reliastra/.env.production
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      # `inspect ping` is answered by the worker itself, so a healthy result
      # proves both the broker connection and a live consumer. Restricted to
      # this node so it does not depend on other workers being up.
      test:
        [
          "CMD-SHELL",
          "celery -A app.infrastructure.celery_app.celery_app inspect ping -d celery@$$HOSTNAME -t 10 | grep -q pong",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    image: ${IMAGE_REF:-ghcr.io/reliastra/reliastra@${IMAGE_DIGEST:?set IMAGE_DIGEST}}
    container_name: reliastra-scheduler
    restart: unless-stopped
    command: ["celery", "-A", "app.infrastructure.celery_app.celery_app", "beat", "--loglevel=info"]
    env_file:
      - /opt/reliastra/.env.production
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      # Beat has no `inspect`. Its liveness proof is the scheduler heartbeat
      # key, whose TTL is derived from CHECK_SCHEDULE_SECONDS — so mere
      # existence already means "beat published within the staleness window".
      # A missing key (stale beat) or an unreachable Redis both fail this.
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).get('reliastra:checks:scheduler:last_heartbeat') else 1)\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: reliastra-redis
    restart: unless-stopped
    # `noeviction`, not `allkeys-lru`: this Redis is the task broker. An LRU
    # policy evicts whatever is least recently used, which under pressure
    # includes queued check tasks and the scheduler/worker heartbeat keys —
    # silently dropping work while the service still looks up. With
    # `noeviction` a full broker fails loudly on write instead, which is what
    # `checks_dispatch_failures_total` and /health/checks report.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--protected-mode", "yes"]
    expose:
      - "6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  public:
    name: reliastra-public
  internal:
    name: reliastra-internal
    internal: true

volumes:
  caddy_data:
  caddy_config:
  redis_data:
