# Production runtime — single VPS (1.6GB RAM), extensible to multi-host
# Usage: IMAGE_DIGEST=sha256:... docker compose --env-file /opt/reliastra/.env.production -f compose.yml up -d
# Never `build:` for app services — pull immutable artifact from GHCR.
#
# ARCHITECTURE NOTE (2026-09-06): the app image is ALL-IN-ONE — one api
# container already runs FastAPI (:8000) + Next.js (:3000) + internal Redis +
# Celery worker + Celery beat under supervisord. There are deliberately NO
# separate worker/scheduler services: the all-in-one entrypoint ignores
# `command:` and would boot a second full stack per service (3x beats
# triple-dispatching, 3x memory → OOM-killer on this box, proven by dmesg).
# A single beat owns dispatch; the internal worker (concurrency 2) owns
# execution. If the box grows, scale the api service, not new services.

name: reliastra

services:
  # ── Reverse proxy — only public entrypoint
  proxy:
    image: caddy:2.9-alpine
    container_name: reliastra-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${IMAGE_REF:-ghcr.io/reliastra/reliastra@${IMAGE_DIGEST:?set IMAGE_DIGEST}}
    container_name: reliastra-api
    restart: unless-stopped
    env_file:
      - /opt/reliastra/.env.production
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
    expose:
      - "8000"
      - "3000"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # NOT read-only: supervisord children need writable /app (celerybeat
    # schedule, Next.js cache) — only /tmp is tmpfs. Revisit with named
    # volumes per writer if the image ever drops root startup.
    read_only: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: reliastra-redis
    restart: unless-stopped
    # `noeviction`, not `allkeys-lru`: this Redis is the task broker. An LRU
    # policy evicts whatever is least recently used, which under pressure
    # includes queued check tasks and the scheduler/worker heartbeat keys —
    # silently dropping work while the service still looks up. With
    # `noeviction` a full broker fails loudly on write instead, which is what
    # `checks_dispatch_failures_total` and /health/checks report.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--protected-mode", "no"]
    # protected-mode no is safe: no host ports published (expose only), so
    # Redis is reachable solely from containers on this isolated network.
    # `yes` breaks Celery (DENIED, no password set) — do not revert.
    expose:
      - "6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # NOT read-only/cap-dropped: the redis entrypoint needs setuid to drop
    # privileges and write access to /data (appendonly). Isolated by network.
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  public:
    name: reliastra-public
  internal:
    # NOT `internal: true`: an isolated bridge breaks Docker's embedded DNS
    # forwarding for external names (Supabase pooler → SERVFAIL). The network
    # has no published ports except via the proxy, which is isolation enough.
    name: reliastra-internal

volumes:
  caddy_data:
  caddy_config:
  redis_data:
