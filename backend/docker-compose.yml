services:
  redis:
    image: redis:7-alpine
    container_name: reliastra-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reliastra-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliastra-api
    restart: always
    # Override the all-in-one image entrypoint: compose owns Redis/Celery.
    entrypoint: ["/bin/sh", "-c"]
    command: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Supabase Postgres URI}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Object storage: Supabase Storage S3 (boto3). Local dev talks to a real
      # Supabase bucket — use a SEPARATE dev bucket from production.
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
      RUN_IN_PROCESS_SCHEDULER: "false"
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  celery-worker:
    build:
      context: .
      dockerfile: celery_worker.dockerfile
    container_name: reliastra-celery-worker
    restart: always
    command: celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Supabase Postgres URI}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliastra-celery-beat
    restart: always
    entrypoint: ["/opt/venv/bin/celery"]
    command: ["-A", "app.infrastructure.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Supabase Postgres URI}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
