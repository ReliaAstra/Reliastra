# Reliastra Production Deployment (VPS)
# Copy this to your VPS at ~/reliastra/docker-compose.production.yml
# Then create a .env.production file with your secrets.
#
# Persistence:
#   - Postgres  → Supabase (DATABASE_URL)
#   - Objects   → Supabase Storage S3 (SUPABASE_S3_*)
#   - Redis     → this compose file (queue / cache only)

services:
  api:
    image: ghcr.io/reliaastra/reliastra-backend:latest
    container_name: reliastra-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - reliastra-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: reliastra-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - reliastra-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

volumes:
  redis_data:
    driver: local

networks:
  reliastra-net:
    driver: bridge
