<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="fig-iam-algebra-t fig-iam-algebra-d" ><rect x="0" y="0" width="960" height="340" fill="#08090A"/><title id="fig-iam-algebra-t">Union inside one account, intersection across accounts, ceilings around both</title><desc id="fig-iam-algebra-d">Three panels. The first shows same-account evaluation as two overlapping rectangles, identity-based policies and resource-based policies, whose union is the grant: an Allow in either is sufficient. The second shows the ceilings as four nested rectangles, RCP outermost, then SCP, then permissions boundary, then session policy, wrapping the grant; each nested rectangle can only shrink the area inside it, never enlarge it. The third shows a cross-account request as two separate account bands divided by a dashed trust boundary: the trusted account holds the identity-based policy and its ceilings, the trusting account holds the resource-based policy and its ceilings, and the request is allowed only when both bands independently return Allow.</desc><text x="20" y="30" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">SAME ACCOUNT · UNION</text><rect x="44" y="70" width="150" height="130" stroke="rgba(242, 242, 238, 0.28)" fill="#111416" stroke-width="1"></rect><rect x="126" y="70" width="150" height="130" stroke="rgba(242, 242, 238, 0.28)" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="70" y="92" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">identity-based</text><text x="196" y="92" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">resource-based</text><text x="167" y="142" text-anchor="middle" fill="#F2F2EE" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10.5px">I ∪ R</text><text x="20" y="228" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">an Allow in either is sufficient;</text><text x="20" y="244" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">one explicit Deny anywhere is not</text><text x="336" y="30" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">CEILINGS · INTERSECTION</text><g><rect x="336" y="44" width="268" height="200" stroke="rgba(242, 242, 238, 0.16)" fill="none" stroke-width="1"></rect><text x="344" y="59" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">RCP</text></g><g><rect x="356" y="66" width="228" height="156" stroke="rgba(242, 242, 238, 0.16)" fill="none" stroke-width="1"></rect><text x="364" y="81" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">SCP</text></g><g><rect x="376" y="88" width="188" height="112" stroke="rgba(242, 242, 238, 0.16)" fill="none" stroke-width="1"></rect><text x="384" y="103" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">permissions boundary</text></g><g><rect x="396" y="110" width="148" height="68" stroke="rgba(242, 242, 238, 0.16)" fill="none" stroke-width="1"></rect><text x="404" y="125" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">session policy</text></g><rect x="436" y="140" width="68" height="26" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="470" y="157" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">grant</text><text x="336" y="268" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">each ring can only subtract from what is inside it</text><text x="650" y="30" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">CROSS ACCOUNT · INTERSECTION OF TWO VERDICTS</text><rect x="650" y="44" width="130" height="200" stroke="rgba(242, 242, 238, 0.28)" fill="#111416" stroke-width="1"></rect><rect x="806" y="44" width="130" height="200" stroke="rgba(242, 242, 238, 0.28)" fill="#111416" stroke-width="1"></rect><line x1="793" y1="36" x2="793" y2="252" stroke="#D9A441" stroke-width="1" stroke-dasharray="4 4"></line><text x="715" y="62" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">ACCOUNT A</text><text x="715" y="78" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">trusted</text><text x="871" y="62" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">ACCOUNT B</text><text x="871" y="78" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">trusting</text><rect x="666" y="94" width="98" height="40" stroke="rgba(242, 242, 238, 0.16)" fill="#08090A" stroke-width="1"></rect><text x="715" y="112" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">identity</text><text x="715" y="126" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">+ ceilings</text><rect x="822" y="94" width="98" height="40" stroke="rgba(242, 242, 238, 0.16)" fill="#08090A" stroke-width="1"></rect><text x="871" y="112" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">resource</text><text x="871" y="126" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">+ ceilings</text><rect x="666" y="160" width="98" height="30" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="715" y="180" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">verdict 1</text><rect x="822" y="160" width="98" height="30" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="871" y="180" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">verdict 2</text><text x="793" y="216" text-anchor="middle" fill="#F2F2EE" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10.5px">verdict 1 ∧ verdict 2</text><text x="650" y="268" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">allowed only if both evaluations independently return Allow</text><text x="793" y="286" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">TRUST BOUNDARY</text></svg>
