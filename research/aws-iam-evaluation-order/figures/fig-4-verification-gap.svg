ect><text x="300" y="314" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">IGNORED FOR STS</text></g><g><rect x="394" y="294" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="482" y="314" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">VALIDATED</text></g><g><rect x="576" y="294" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="664" y="314" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="758" y="294" width="176" height="32" stroke="rgba(242, 242, 238, 0.16)" fill="#08090A" stroke-width="1"></rect><text x="846" y="314" text-anchor="middle" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">NOT NAMED</text></g></g><text x="12" y="358" fill="#666B70" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">evaluated = the route decides the class; partial = decides it only under the stated condition; not supported = the route does not accept it</text><text x="12" y="376" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">no single pre-deployment route covers all seven classes</text></svg>
