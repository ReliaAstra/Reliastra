<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="fig-iam-verification-gap-t fig-iam-verification-gap-d" ><rect x="0" y="0" width="960" height="380" fill="#08090A"/><title id="fig-iam-verification-gap-t">What each verification route can evaluate, by policy class</title><desc id="fig-iam-verification-gap-d">A capability matrix. Rows are the seven policy classes that participate in an authorisation decision: identity-based, resource-based, permissions boundary, session policy, service control policy, resource control policy and IAM role trust policy. Columns are the four routes an engineer can use to check a decision before or after it happens: the IAM Policy Simulator, an IAM Access Analyzer custom policy check, a live API call against the control plane, and the decoded authorization message returned after a denial. Cells are marked evaluated, partial with the condition stated, or not supported. The pattern the matrix shows is that the two cheap pre-deployment routes each leave at least one policy class unevaluated, the live API call evaluates every class but only for the request actually issued, and the decoded message distinguishes an explicit deny from an absent allow without naming the policy class that decided.</desc><text x="300" y="44" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">IAM Policy Simulator</text><text x="482" y="44" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">Access Analyzer check</text><text x="664" y="44" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">live API call</text><text x="846" y="44" text-anchor="middle" fill="#D6D8D5" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10px">decoded auth message</text><line x1="12" y1="54" x2="940" y2="54" stroke="rgba(242, 242, 238, 0.16)" stroke-width="1"></line><g><text x="12" y="86" fill="#F2F2EE" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10.5px">identity-based</text><g><rect x="212" y="66" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="300" y="86" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="394" y="66" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="482" y="86" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="576" y="66" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="664" y="86" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="758" y="66" width="176" height="32" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="846" y="86" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">AFTER THE FACT</text></g></g><g><text x="12" y="124" fill="#F2F2EE" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10.5px">resource-based</text><g><rect x="212" y="104" width="176" height="32" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="300" y="124" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">NOT FOR ROLES</text></g><g><rect x="394" y="104" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="482" y="124" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="576" y="104" width="176" height="32" stroke="#57A773" fill="rgba(87, 163, 115, 0.12)" stroke-width="1"></rect><text x="664" y="124" text-anchor="middle" fill="#57A773" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">EVALUATED</text></g><g><rect x="758" y="104" width="176" height="32" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="846" y="124" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">AFTER THE FACT</text></g></g><g><text x="12" y="162" fill="#F2F2EE" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="10.5px">permissions boundary</text><g><rect x="212" y="142" width="176" height="32" stroke="#D9A441" fill="rgba(217, 164, 65, 0.10)" stroke-width="1"></rect><text x="300" y="162" text-anchor="middle" fill="#D9A441" font-family=""JetBrains Mono", "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace" font-size="9.5px">ONE AT A TIME</text></g><g><rect x="394" y="142" width="176" hei