name: zz-diag
on:
  push:
    branches: [arena/01a0cdf8-reliastra]
permissions:
  contents: read
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true
      - name: goreleaser check
        id: check
        continue-on-error: true
        run: |
          { echo "$ goreleaser check"; goreleaser check; echo "exit=$?"; } > /tmp/check.log 2>&1
          cat /tmp/check.log
      - name: publish output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          { echo "## goreleaser check — ${{ github.sha }}"; echo '```'; cat /tmp/check.log; echo '```'; } > /tmp/out.md
          gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/out.md
