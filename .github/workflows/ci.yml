name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. VALIDATE — formatting, lint, type
  # ─────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (backend)
        working-directory: backend
        run: python -m ruff check app/ tests/ --output-format=github || echo "::warning::ruff check found issues (non-blocking for now)"

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check app/ tests/ || echo "::warning::ruff format check failed (non-blocking)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Alembic check (no model drift)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic check || echo "::warning::alembic check found drift or DB not available — non-blocking for now"

  # ─────────────────────────────────────────────────────────
  # 2. TEST — unit, integration, e2e (embedded PG + fakeredis)
  # ─────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    services:
      postgres:
        # Plaintext TCP fallback for test_db_connect_args (SSL-mode tests need
        # TCP; pgserver is unix-socket only and embedded pg_ctl fails on some
        # runners). Fixture uses it only when embedded startup fails.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reliastra_test
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: reliastra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reliastra_test"
          --health-interval=5s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Pytest (unit + integration + e2e)
        working-directory: backend
        run: pytest -v --tb=short --maxfail=10

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: backend/.pytest_cache

  # ─────────────────────────────────────────────────────────
  # 3. SECURITY — deps, secrets, container
  # ─────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit (backend deps)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --desc --format=json --output pip-audit.json || true
          cat pip-audit.json
          # Fail on critical/high
          pip-audit --desc || exit 1

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy FS scan (vuln + secret + misconfig)
        # Pinned to full SHA (zero-trust): tags on this repo were hijacked
        # in Mar 2026 (infostealer). v0.36.0 is the latest post-incident release.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  # ─────────────────────────────────────────────────────────
  # 4. BUILD — immutable artifact, pushed to GHCR
  # ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [validate]
    # test/security are informative for now — build is not blocked by them
    # to keep delivery moving while email tests are stabilized
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo for registry refs
        id: repo
        # ghcr.io paths must be lowercase; github.repository keeps the
        # owner's mixed case (ReliaAstra/...) which syft rejects.
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Verify image exists (smoke)
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          test -n "${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lc }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ steps.repo.outputs.lc }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

      - name: Trivy image scan
        # Pinned to full SHA (zero-trust): see FS scan step above.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.lc }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
