# Release CLI — one tag, four distribution channels.
#
# Cutting a release is documented in cli/RELEASING.md. Pushing a tag of the
# form v0.2.1 runs this workflow:
#
#   1. verify   — one version everywhere, gofmt/vet/test, the full
#                 cross-compile matrix, goreleaser check, npm and PyPI
#                 packaging checks, installer smoke test. Nothing below runs
#                 unless all of it passes.
#   2. binaries — goreleaser builds linux/darwin/windows × amd64/arm64,
#                 archives them, uploads the raw binaries the installers
#                 download, writes checksums.txt and creates the GitHub
#                 release. Then it pushes the Go module tag (cli/v0.2.1)
#                 that makes `go install …@latest` resolve.
#   3. npm      — publishes the thin installer `reliastra`.
#   4. pypi     — publishes the same installer shape as `reliastra`.
#   5. install-smoke — installs through npm and pip and runs the CLI, so a
#                 release that publishes a broken download is caught here.
#
# Stages 3 and 4 wait for 2 because they download from its release.
#
# Authentication: npm and PyPI use trusted publishing (OIDC) — no tokens in
# this repository. One-time setup is documented in cli/RELEASING.md; the
# publish steps fall back to the NPM_TOKEN / PYPI_API_TOKEN secrets if a
# maintainer has configured them instead.
#
# Every third-party action is pinned to a full commit SHA. Tags on this
# repository were hijacked in Mar 2026 (infostealer), so a mutable tag is
# not an acceptable reference.

name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1). Leave empty for a dry run of the selected ref."
        type: string
        required: false
      dry_run:
        description: "Build and package everything, publish nothing"
        type: boolean
        default: true

# Least privilege: each job adds only what it needs.
permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "24" # npm >= 11.5 for OIDC trusted publishing
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. VERIFY — the gate. A failed check here means nothing is
  #    built, released or published.
  # ─────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.mod

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Install GoReleaser
        # install-only: the gate runs `goreleaser check` itself, alongside
        # every other check, so the checks live in one script that
        # maintainers can also run locally (cli/test/release_check.sh).
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Resolve the release version
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$tag" ]; then
            mode="release"
            version="${tag#v}"
          else
            # Dry run from a branch: the tree's own version is the subject.
            mode="dry-run"
            version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)"
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            mode="dry-run"
          fi
          {
            echo "version=$version"
            echo "mode=$mode"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$version tag=${tag:-<none>}"

      - name: Release gate
        # One script (cli/test/release_check.sh) is the whole gate, and it is
        # the same script CI runs on every push, so the release pipeline
        # cannot drift from the checks that run between releases. A "skip"
        # means a tool was missing on the runner; in CI that is a failure.
        run: |
          set -euo pipefail
          bash cli/test/release_check.sh "${{ steps.resolve.outputs.version }}" 2>&1 | tee /tmp/release-check.log
          if grep -q '^skip:' /tmp/release-check.log; then
            echo "::error::a release check was skipped on the runner; see the log above"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # 2. BINARIES — goreleaser: build, archive, checksum, release
  # ─────────────────────────────────────────────────────────
  binaries:
    name: Binaries
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload the assets
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.tag || github.ref }}
          fetch-depth: 0 # goreleaser: full history and tags for the changelog

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.mod

      - name: Tag the dry-run version locally
        if: needs.verify.outputs.mode == 'dry-run'
        # A dry run produces release-shaped artifacts without publishing
        # them. GoReleaser reads the version from a tag, so the version the
        # tree declares is tagged here — locally, in the checkout, never
        # pushed.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v$VERSION"

      - name: "Build (snapshot: no release, no publish)"
        if: needs.verify.outputs.mode == 'dry-run'
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Create the GitHub release
        if: needs.verify.outputs.mode == 'release'
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release artifacts
        # Every platform a user can install on, present, complete and
        # matching checksums.txt — recomputed here, not trusted from the
        # build.
        run: bash cli/test/artifacts_check.sh "${{ needs.verify.outputs.version }}" dist

      - name: Upload the build (dry-run inspection)
        if: needs.verify.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reliastra-dist-${{ needs.verify.outputs.version }}
          path: dist/
          retention-days: 7

      - name: Publish the Go module tag
        if: needs.verify.outputs.mode == 'release'
        # `go install github.com/ReliaAstra/Reliastra/cli/cmd/reliastra@latest`
        # resolves through the module proxy, and a module in a subdirectory
        # is versioned by a tag carrying that subdirectory as a prefix:
        # cli/v0.2.1. Same commit as the release tag, pushed by this
        # workflow — one release, one version, two tags.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          module_tag="cli/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$module_tag" >/dev/null 2>&1; then
            echo "$module_tag already exists — leaving it alone (tags are immutable)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$module_tag" HEAD
          git push origin "refs/tags/$module_tag"

  # ─────────────────────────────────────────────────────────
  # 3. NPM — thin installer package `reliastra`
  # ─────────────────────────────────────────────────────────
  npm:
    name: Publish npm (reliastra)
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: npm must support trusted publishing
        # Trusted publishing needs npm >= 11.5. Node 24 ships it; if the
        # runner is older, upgrade in place rather than publish unattended.
        run: |
          set -euo pipefail
          current="$(npm --version)"
          major="${current%%.*}"
          minor="$(echo "$current" | cut -d. -f2)"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm $current is older than 11.5; upgrading for trusted publishing"
            npm install -g npm@latest
          fi
          npm --version

      - name: Sync the package version to the release
        working-directory: cli/npm
        # The gate already proved the committed version equals the tag. This
        # makes the published version equal the tag even if it did not, so
        # the wrapper can never download a binary of a different version.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish (dry run)
        if: needs.verify.outputs.mode != 'release'
        working-directory: cli/npm
        run: npm publish --access public --provenance --dry-run

      - name: Publish
        if: needs.verify.outputs.mode == 'release'
        working-directory: cli/npm
        # Trusted publishing (preferred): with id-token: write and npm
        # >= 11.5 this needs no secret once the trusted publisher is
        # configured on npmjs.com (cli/RELEASING.md). Falls back to
        # NODE_AUTH_TOKEN when a maintainer has set NPM_TOKEN.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # 4. PYPI — thin installer package `reliastra` (pip / pipx)
  # ─────────────────────────────────────────────────────────
  pypi:
    name: Publish PyPI (reliastra)
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi # the trusted publisher is registered against this name
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync the package version to the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: cli/python
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/reliastra/__init__.py

      - name: Build sdist and wheel
        working-directory: cli/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the distributions
        working-directory: cli/python
        run: python -m twine check dist/*

      - name: Publish (dry run)
        if: needs.verify.outputs.mode != 'release'
        working-directory: cli/python
        # Nothing leaves the runner: the built distributions are the ones a
        # release would upload, checked and listed.
        run: |
          ls -l dist/
          echo "dry run: not uploading to PyPI"

      - name: Publish
        if: needs.verify.outputs.mode == 'release'
        # Trusted publishing (preferred): needs the trusted publisher
        # configured on pypi.org (project reliastra, workflow
        # release-cli.yml, environment pypi — cli/RELEASING.md). Falls back
        # to the PYPI_API_TOKEN secret when one is set.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: cli/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # 5. INSTALL SMOKE — install through npm and pip, then run it
  # ─────────────────────────────────────────────────────────
  install-smoke:
    name: Install smoke test
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build

      - name: Download the built release
        if: needs.verify.outputs.mode == 'dry-run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reliastra-dist-${{ needs.verify.outputs.version }}
          path: dist

      - name: Install through npm and pip, then run the CLI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MODE: ${{ needs.verify.outputs.mode }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION")
          if [ "$MODE" = "dry-run" ]; then
            # The GitHub release does not exist in a dry run; install from
            # the binaries that were just built, served over loopback.
            args+=(--dist dist --skip-release-url)
          fi
          bash cli/test/install_smoke_test.sh "${args[@]}"
