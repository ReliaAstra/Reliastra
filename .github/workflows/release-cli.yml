# Release CLI — one tag, three distribution channels.
#
# Cutting a release is documented in cli/RELEASING.md. Summary: push a tag
# of the form v0.2.1 and this workflow
#
#   1. runs goreleaser: builds linux/darwin/windows × amd64/arm64 binaries,
#      archives, raw binaries, and checksums.txt into a GitHub release;
#   2. publishes the npm package `reliastra` (a thin installer whose first
#      run downloads the raw binary from that same release);
#   3. publishes the PyPI package `reliastra` (same installer shape).
#
# Stages 2 and 3 wait for stage 1 because they download from its release.
#
# Authentication: npm and PyPI use trusted publishing (OIDC) — no tokens in
# secrets. One-time setup is documented in cli/RELEASING.md; until it is
# done, publish manually or add the NPM_TOKEN / PYPI_API_TOKEN secrets
# (both jobs fall back to them automatically).

name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # goreleaser: create the release, upload artifacts

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "24" # npm >= 11.5 for OIDC trusted publishing
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. BINARIES — goreleaser builds, archives, checksums, releases
  # ─────────────────────────────────────────────────────────
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Pinned to full SHA (zero-trust): tags on this repo were hijacked
        # in Mar 2026 (infostealer). See the trivy pin in ci.yml.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # goreleaser: full history + tags for the changelog

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # 2. NPM — thin installer package `reliastra`
  # ─────────────────────────────────────────────────────────
  npm:
    name: Publish npm (reliastra)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: binaries
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Sync package version to the tag
        working-directory: cli/npm
        # The committed version is a placeholder; the tag is the source of
        # truth so package version and downloaded binary version always
        # match.
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: cli/npm
        # Trusted publishing (preferred): with id-token: write and npm
        # >= 11.5 this needs no secret once the trusted publisher is
        # configured on npmjs.com (cli/RELEASING.md). Falls back to
        # NODE_AUTH_TOKEN if NPM_TOKEN is set.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────
  # 3. PYPI — thin installer package `reliastra` (pip / pipx)
  # ─────────────────────────────────────────────────────────
  pypi:
    name: Publish PyPI (reliastra)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: binaries
    environment: pypi # trusted publisher is configured against this name
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync package version to the tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" cli/python/pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" cli/python/src/reliastra/__init__.py

      - name: Build sdist and wheel
        working-directory: cli/python
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish
        # Trusted publishing (preferred): needs the trusted publisher
        # configured on pypi.org (project reliastra, workflow
        # release-cli.yml, environment pypi — cli/RELEASING.md). Falls
        # back to the PYPI_API_TOKEN secret if present.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: cli/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
