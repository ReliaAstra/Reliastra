# TEMPORARY verification workflow — deleted before this branch is finished.
# It exists only because the sandbox this work is done from has no Go
# toolchain and no access to proxy.golang.org: the checks below need a
# runner with both.
name: zz-verify-tmp

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0cdf8-reliastra]

permissions:
  contents: write # push the verification report to the scratch branch

env:
  GO_VERSION: "1.23"

jobs:
  go-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Release gate
        id: gate
        run: |
          set -euo pipefail
          bash cli/test/release_check.sh > /tmp/gate.log 2>&1 || { cat /tmp/gate.log; exit 1; }
          cat /tmp/gate.log

      - name: GoReleaser snapshot (real binaries)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v$version"
          goreleaser release --snapshot --clean --skip=publish
          ls -l dist/

      - name: Artifact check
        run: bash cli/test/artifacts_check.sh "$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)" dist

      - name: Install smoke test (real binaries, loopback)
        run: |
          bash cli/test/install_smoke_test.sh --dist dist --skip-release-url 2>&1 | tee /tmp/install-smoke.log

      # ── Does `go install` work, and which tag form does it need? ──────────
      # The CLI is a Go module in a subdirectory (cli/go.mod), so the module
      # proxy expects the tag to carry the subdirectory prefix (cli/v0.2.0).
      # This proves it against a local clone, with no dependency on the
      # proxy's index and no tags pushed to the real repository.
      - name: go install tag-prefix experiment
        run: |
          set -uo pipefail
          report=/tmp/goinstall.log
          : > "$report"
          version="9.9.9"
          work="$RUNNER_TEMP/goinstall"
          rm -rf "$work"; mkdir -p "$work"
          git clone --quiet "https://github.com/ReliaAstra/Reliastra.git" "$work/repo"
          cd "$work/repo"
          git config user.email bot@example.com
          git config user.name bot
          export GOPRIVATE="github.com/ReliaAstra/*"
          export GONOSUMDB="*"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          export GOBIN="$work/bin"
          git config --global url."$work/repo".insteadOf "https://github.com/ReliaAstra/Reliastra"

          try() { # <label> <ref>
            echo "=== $1: go install ...@$2" >> "$report"
            rm -rf "$GOBIN"; mkdir -p "$GOBIN"
            if GOBIN="$GOBIN" go install "github.com/ReliaAstra/Reliastra/cli/cmd/reliastra@$2" >>"$report" 2>&1; then
              echo "    RESULT: installed; --version reports $("$GOBIN/reliastra" --version 2>&1)" >> "$report"
            else
              echo "    RESULT: FAILED" >> "$report"
            fi
          }

          # Case A: a plain v-prefixed tag (what GitHub Releases uses).
          git tag -f "v$version"
          try "tag v9.9.9 (no module prefix)" "v$version"
          try "tag v9.9.9 via @latest" "latest"
          git tag -d "v$version" >/dev/null

          # Case B: the module-prefixed tag the release workflow pushes.
          git tag -f "cli/v$version"
          try "tag cli/v9.9.9 (module prefix)" "v$version"
          try "tag cli/v9.9.9 via @latest" "latest"
          cat "$report"

      - name: Write report
        run: |
          set -euo pipefail
          mkdir -p /tmp/report
          {
            echo "# CLI distribution verification — run ${{ github.run_id }}"
            echo
            echo "commit: ${{ github.sha }}"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '## release gate'
            echo '```'
            cat /tmp/gate.log
            echo '```'
            echo
            echo '## go install tag prefix'
            echo '```'
            cat /tmp/goinstall.log
            echo '```'
            echo
            echo '## dist listing'
            echo '```'
            ls -l dist/ || true
            echo '```'
          } > /tmp/report/verification.md

      - name: Push the report
        # The runner's logs cannot be read from the environment this work is
        # done in, so the report is fetched as a file instead.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "arena/tmp-report"
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp /tmp/report/verification.md verification.md
          git add verification.md
          git commit -q -m "verification report (temporary)"
          git push --force origin "arena/tmp-report"

      - name: Push dist for local inspection
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "arena/tmp-dist"
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp -r dist/. .
          git add -A
          git commit -q -m "dist snapshot (temporary)"
          git push --force origin "arena/tmp-dist"
