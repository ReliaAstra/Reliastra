# TEMPORARY verification workflow — deleted before this branch is finished.
# It exists only because the sandbox this work is done from has no Go
# toolchain and no access to proxy.golang.org: the checks below need a
# runner with both.
name: zz-verify-tmp

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0cdf8-reliastra]

permissions:
  contents: read
  pull-requests: write # post the verification report where it can be read

env:
  GO_VERSION: "1.23"

jobs:
  go-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install packaging tools
        continue-on-error: true
        run: python -m pip install --upgrade pip build twine > /tmp/tools.log 2>&1 || { cat /tmp/tools.log; exit 1; }

      - name: Install GoReleaser
        continue-on-error: true
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Diagnostics
        run: |
          {
            echo "goreleaser on PATH: $(command -v goreleaser || echo NO)"
            echo "goreleaser --version: $(goreleaser --version 2>&1 | head -3)"
            echo "go: $(command -v go || echo NO)"
            echo "node: $(command -v node || echo NO)"
            echo "python3: $(command -v python3 || echo NO)"
            echo "twine: $(python3 -m twine --version 2>&1 | head -1)"
            echo "build: $(python3 -m build --version 2>&1 | head -1)"
          } > /tmp/diagnostics.log 2>&1
          cat /tmp/diagnostics.log

      - name: Release gate
        continue-on-error: true
        id: gate
        run: |
          set -uo pipefail
          bash cli/test/release_check.sh > /tmp/gate.log 2>&1
          echo "gate-exit=$?" >> /tmp/gate.log
          echo "--- skip lines ---" >> /tmp/gate.log
          grep '^skip:' /tmp/gate.log >> /tmp/gate.log 2>/dev/null || true
          cat /tmp/gate.log

      - name: GoReleaser snapshot (real binaries)
        continue-on-error: true
        id: snapshot
        run: |
          set -uo pipefail
          version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v$version"
          goreleaser release --snapshot --clean --skip=publish > /tmp/snapshot.log 2>&1
          echo "exit=$?" >> /tmp/snapshot.log
          tail -30 /tmp/snapshot.log
          ls -l dist/ >> /tmp/snapshot.log 2>&1

      - name: Artifact check
        continue-on-error: true
        run: |
          bash cli/test/artifacts_check.sh "$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)" dist > /tmp/artifacts.log 2>&1
          echo "exit=$?" >> /tmp/artifacts.log
          cat /tmp/artifacts.log

      - name: Install smoke test (real binaries, loopback)
        continue-on-error: true
        run: |
          bash cli/test/install_smoke_test.sh --dist dist --skip-release-url > /tmp/install-smoke.log 2>&1
          echo "exit=$?" >> /tmp/install-smoke.log
          cat /tmp/install-smoke.log

      - name: go install tag-prefix experiment
        continue-on-error: true
        run: |
          set -uo pipefail
          report=/tmp/goinstall.log
          : > "$report"
          version="9.9.9"
          work="$RUNNER_TEMP/goinstall"
          rm -rf "$work"; mkdir -p "$work"
          git clone --quiet "https://github.com/ReliaAstra/Reliastra.git" "$work/repo" >>"$report" 2>&1
          cd "$work/repo"
          git config user.email bot@example.com
          git config user.name bot
          export GOPRIVATE="github.com/ReliaAstra/*"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          export GOBIN="$work/bin"
          git config --global url."$work/repo".insteadOf "https://github.com/ReliaAstra/Reliastra"

          try() { # <label> <ref>
            echo "=== $1: go install ...@$2" >> "$report"
            rm -rf "$GOBIN"; mkdir -p "$GOBIN"
            if GOBIN="$GOBIN" go install "github.com/ReliaAstra/Reliastra/cli/cmd/reliastra@$2" >>"$report" 2>&1; then
              echo "    RESULT: installed; --version reports $("$GOBIN/reliastra" --version 2>&1)" >> "$report"
            else
              echo "    RESULT: FAILED" >> "$report"
            fi
          }

          git tag -f "v$version"
          try "tag v9.9.9 (no module prefix)" "v$version"
          try "tag v9.9.9 via @latest" "latest"
          git tag -d "v$version" >/dev/null

          git tag -f "cli/v$version"
          try "tag cli/v9.9.9 (module prefix)" "v$version"
          try "tag cli/v9.9.9 via @latest" "latest"
          cat "$report"

      - name: Write report
        if: always()
        run: |
          mkdir -p /tmp/report
          out=/tmp/report/verification.md
          {
            echo "# CLI distribution verification — run ${{ github.run_id }}"
            echo
            echo "commit: ${{ github.sha }}"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for f in diagnostics tools gate snapshot artifacts install-smoke goinstall; do
              echo "## $f"
              echo '```'
              cat "/tmp/$f.log" 2>/dev/null || echo "(no output)"
              echo '```'
              echo
            done
          } > "$out"
          cat "$out"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: /tmp/report/verification.md

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          echo "pr=${pr}"
          gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/report/verification.md

      - name: Can this token write to the repository?
        if: always()
        # The release workflow pushes the Go module tag with the built-in
        # token. If that is not possible here, the Go channel needs a
        # different mechanism — so find out now, visibly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "permissions of GITHUB_TOKEN on ${GITHUB_REPOSITORY}:"
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' 2>&1 | head -5 || true
          echo "push test:"
          git push origin "HEAD:refs/heads/arena/tmp-push-test" 2>&1 | tail -3 | sed 's/^/  /' || true
          echo "push conclusion: $?" 
