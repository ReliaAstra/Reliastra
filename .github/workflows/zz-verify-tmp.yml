# TEMPORARY verification workflow — deleted before this branch is finished.
#
# It exists only because the environment this work is done from has no Go
# toolchain and no route to proxy.golang.org, so the checks below have to
# run on a runner. Findings are posted as a pull-request comment, because
# job logs are not readable from here.
name: zz-verify-tmp

on:
  push:
    branches: [arena/01a0cdf8-reliastra]

permissions:
  contents: read
  pull-requests: write

env:
  GO_VERSION: "1.23"

jobs:
  go-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install packaging tools
        continue-on-error: true
        run: python -m pip install --upgrade pip build twine > /tmp/tools.log 2>&1 || { cat /tmp/tools.log; exit 1; }

      - name: Install GoReleaser
        continue-on-error: true
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Can this token write to the repository?
        continue-on-error: true
        # The release workflow pushes the Go module tag with the built-in
        # token. If that is impossible here, the Go channel needs another
        # mechanism — so find out, visibly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "GITHUB_TOKEN permissions on ${GITHUB_REPOSITORY}:"
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' 2>&1 | head -5
            echo
            echo "git push test:"
            git push origin "HEAD:refs/heads/arena/tmp-push-test" 2>&1 | tail -3 | sed 's/^/  /'
            echo "  (exit $?)"
          } > /tmp/token.log 2>&1
          cat /tmp/token.log

      - name: Release gate
        continue-on-error: true
        id: gate
        run: |
          set -uo pipefail
          bash cli/test/release_check.sh > /tmp/gate.log 2>&1
          echo "gate-exit=$?" >> /tmp/gate.log
          cat /tmp/gate.log

      - name: GoReleaser snapshot (real binaries)
        continue-on-error: true
        id: snapshot
        run: |
          set -uo pipefail
          version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v$version"
          goreleaser release --snapshot --clean --skip=publish > /tmp/snapshot.log 2>&1
          echo "exit=$?" >> /tmp/snapshot.log
          grep -E "archiving|building|snapshotting|error|Error" /tmp/snapshot.log | sed 's/\x1b\[[0-9;]*m//g' | tail -20 >> /tmp/snapshot.log
          {
            echo
            echo "── dist layout"
            find dist -maxdepth 2 | sort | head -30
            echo
            echo "── checksums.txt"
            cat dist/checksums.txt 2>/dev/null | head -20
            echo
            echo "── artifacts.json (type / name / path)"
            python3 -c "import json; [print(a.get('type'), '|', a.get('name'), '|', a.get('path')) for a in json.load(open('dist/artifacts.json'))]" 2>&1
          } >> /tmp/snapshot.log 2>&1
          tail -70 /tmp/snapshot.log

      - name: Artifact check
        continue-on-error: true
        run: |
          bash cli/test/artifacts_check.sh "$(sed -n 's/^var version = "\(.*\)"$/\1/p' cli/cmd/reliastra/main.go)" dist > /tmp/artifacts.log 2>&1
          echo "exit=$?" >> /tmp/artifacts.log
          cat /tmp/artifacts.log

      - name: Install smoke test (real binaries, loopback)
        continue-on-error: true
        run: |
          bash cli/test/install_smoke_test.sh --dist dist --skip-release-url > /tmp/install-smoke.log 2>&1
          echo "exit=$?" >> /tmp/install-smoke.log
          cat /tmp/install-smoke.log

      # ── Does `go install` work, and which tag form does it need? ──────────
      # The CLI is a Go module in a subdirectory (cli/go.mod), so the module
      # proxy versions it from a tag carrying that subdirectory as a prefix.
      # Proven against a clone of this repository, with a fresh module cache
      # per case so no result is a caching artefact.
      - name: go install tag-prefix experiment
        continue-on-error: true
        run: |
          set -uo pipefail
          report=/tmp/goinstall.log
          : > "$report"
          work="$RUNNER_TEMP/goinstall"
          rm -rf "$work"; mkdir -p "$work"
          git clone --quiet "https://github.com/ReliaAstra/Reliastra.git" "$work/repo" >>"$report" 2>&1
          git config --global url."$work/repo".insteadOf "https://github.com/ReliaAstra/Reliastra"

          try() { # <label> <tag> <ref>
            local label="$1" tag="$2" ref="$3"
            local id="$RANDOM$RANDOM"
            local cache="$work/gomodcache-$id"
            local bin="$work/bin-$id"
            mkdir -p "$cache" "$bin"
            (
              cd "$work/repo" || exit 1
              for old in $(git tag -l); do git tag -d "$old" >/dev/null; done
              git tag -f "$tag"
              GOMODCACHE="$cache" GOPATH="$cache-path" GOPROXY=direct GOSUMDB=off \
                GOFLAGS=-mod=mod GOPRIVATE="github.com/ReliaAstra/*" GOBIN="$bin" \
                go install "github.com/ReliaAstra/Reliastra/cli/cmd/reliastra@$ref"
            ) >>"$report" 2>&1
            if [ -x "$bin/reliastra" ]; then
              echo "    RESULT: installed; --version reports $($bin/reliastra --version 2>&1)" >> "$report"
            else
              echo "    RESULT: FAILED" >> "$report"
            fi
          }

          echo "=== case A: tag v9.9.9 (the GitHub release tag, no module prefix)" >> "$report"
          try "  explicit @v9.9.9" "v9.9.9" "v9.9.9"
          try "  @latest"          "v9.9.9" "latest"

          echo "=== case B: tag cli/v9.9.9 (module-subdirectory prefix)" >> "$report"
          try "  explicit @v9.9.9" "cli/v9.9.9" "v9.9.9"
          try "  @latest"          "cli/v9.9.9" "latest"

          cat "$report"

      - name: Write report
        if: always()
        run: |
          mkdir -p /tmp/report
          out=/tmp/report/verification.md
          {
            echo "# CLI distribution verification — run ${{ github.run_id }}"
            echo
            echo "commit: ${{ github.sha }}"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for f in token gate snapshot artifacts install-smoke goinstall; do
              echo "## $f"
              echo '```'
              cat "/tmp/$f.log" 2>/dev/null || echo "(no output)"
              echo '```'
              echo
            done
          } > "$out"
          head -c 60000 "$out"

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          echo "pr=${pr}"
          gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/report/verification.md
