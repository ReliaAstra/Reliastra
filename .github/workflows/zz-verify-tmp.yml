# TEMPORARY verification workflow — deleted before this branch is finished.
# It exists only because the sandbox this work is done from has no Go
# toolchain and no access to proxy.golang.org: the checks below need a
# runner with both.
name: zz-verify-tmp

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0cdf8-reliastra]

permissions:
  contents: write # push the verification report to the scratch branch

env:
  GO_VERSION: "1.23"

jobs:
  go-and-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install packaging tools
        continue-on-error: true
        run: python -m pip install --upgrade pip build twine > /tmp/tools.log 2>&1 || { cat /tmp/tools.log; exit 1; }

      - name: Install GoReleaser
        continue-on-error: true
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Release gate
        continue-on-error: true
        id: gate
        run: |
          set -uo pipefail
          bash cli/test/release_check.sh > /tmp/gate.log 2>&1
          echo "exit=$?" >> /tmp/gate.log
          cat /tmp/gate.log

      - name: GoReleaser snapshot (real binaries)
        continue-on-error: true
        id: snapshot
        run: |
          set -uo pipefail
          version="$(sed -n 's/^var version = "\(.*\)"$//p' cli/cmd/reliastra/main.go)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v$version"
          goreleaser release --snapshot --clean --skip=publish > /tmp/snapshot.log 2>&1
          echo "exit=$?" >> /tmp/snapshot.log
          tail -30 /tmp/snapshot.log
          ls -l dist/ >> /tmp/snapshot.log 2>&1

      - name: Artifact check
        continue-on-error: true
        run: |
          bash cli/test/artifacts_check.sh "$(sed -n 's/^var version = "\(.*\)"$//p' cli/cmd/reliastra/main.go)" dist > /tmp/artifacts.log 2>&1
          echo "exit=$?" >> /tmp/artifacts.log
          cat /tmp/artifacts.log

      - name: Install smoke test (real binaries, loopback)
        continue-on-error: true
        run: |
          bash cli/test/install_smoke_test.sh --dist dist --skip-release-url > /tmp/install-smoke.log 2>&1
          echo "exit=$?" >> /tmp/install-smoke.log
          cat /tmp/install-smoke.log

      - name: go install tag-prefix experiment
        continue-on-error: true
        run: |
          set -uo pipefail
          report=/tmp/goinstall.log
          : > "$report"
          version="9.9.9"
          work="$RUNNER_TEMP/goinstall"
          rm -rf "$work"; mkdir -p "$work"
          git clone --quiet "https://github.com/ReliaAstra/Reliastra.git" "$work/repo" >>"$report" 2>&1
          cd "$work/repo"
          git config user.email bot@example.com
          git config user.name bot
          export GOPRIVATE="github.com/ReliaAstra/*"
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          export GOBIN="$work/bin"
          git config --global url."$work/repo".insteadOf "https://github.com/ReliaAstra/Reliastra"

          try() { # <label> <ref>
            echo "=== $1: go install ...@$2" >> "$report"
            rm -rf "$GOBIN"; mkdir -p "$GOBIN"
            if GOBIN="$GOBIN" go install "github.com/ReliaAstra/Reliastra/cli/cmd/reliastra@$2" >>"$report" 2>&1; then
              echo "    RESULT: installed; --version reports $("$GOBIN/reliastra" --version 2>&1)" >> "$report"
            else
              echo "    RESULT: FAILED" >> "$report"
            fi
          }

          git tag -f "v$version"
          try "tag v9.9.9 (no module prefix)" "v$version"
          try "tag v9.9.9 via @latest" "latest"
          git tag -d "v$version" >/dev/null

          git tag -f "cli/v$version"
          try "tag cli/v9.9.9 (module prefix)" "v$version"
          try "tag cli/v9.9.9 via @latest" "latest"
          cat "$report"

      - name: Write report
        if: always()
        run: |
          mkdir -p /tmp/report
          out=/tmp/report/verification.md
          {
            echo "# CLI distribution verification — run ${{ github.run_id }}"
            echo
            echo "commit: ${{ github.sha }}"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for f in tools gate snapshot artifacts install-smoke goinstall; do
              echo "## $f"
              echo '```'
              cat "/tmp/$f.log" 2>/dev/null || echo "(no output)"
              echo '```'
              echo
            done
          } > "$out"
          cat "$out"

      - name: Push the report
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "arena/tmp-report"
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp /tmp/report/verification.md verification.md
          git add verification.md
          git commit -q -m "verification report (temporary)"
          git push --force origin "arena/tmp-report"

      - name: Push dist for local inspection
        if: always()
        run: |
          set -euo pipefail
          [ -d dist ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "arena/tmp-dist"
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ./* ./.github 2>/dev/null || true
          cp -r dist/. .
          git add -A
          git commit -q -m "dist snapshot (temporary)"
          git push --force origin "arena/tmp-dist"
