name: Report an engineering problem
description: Reproduce an incorrect observation, incident, artifact, API response, or runtime behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report observed behavior, not just a conclusion about the vendor. A synthetic
        fixture is more useful than an unredacted production log. Search existing issues first.
        Do not include credentials, private endpoints, customer data, or signed download URLs.
        For vulnerabilities, use security@reliastra.com instead of this public form.
  - type: input
    id: revision
    attributes:
      label: Revision and component
      description: Commit/version and affected component (API, CLI, probe, scheduler, attribution, evidence, or UI).
      placeholder: Commit SHA; component; relevant method or route
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, sanitized inputs or a synthetic fixture, and exact commands. Do not attach environment files.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: What failed, what should have happened, and the concrete operational consequence. Distinguish measurement from inference.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and limitations
      description: For incident reports, include UTC windows, sample counts/gaps, methodology version, supporting and contradictory signals. For other bugs, include sanitized output or test failures. State what is unknown.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime and observation topology
      description: Relevant runtime versions, single/multi topology, actual independent origins versus region labels, and scheduler/worker health if applicable. No hostnames or credentials.
  - type: input
    id: related
    attributes:
      label: Related issue or discussion
      description: Link related investigation or prior reports, if any.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I have removed secrets, customer data, private infrastructure details, and signed URLs from this report and its attachments.
          required: true
